#      - minio
#    environment:
#      SPRING_PROFILES_ACTIVE: docker
#      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/file_exchange_db
#      SPRING_DATASOURCE_USERNAME: your_db_user
#      SPRING_DATASOURCE_PASSWORD: your_db_password
#      APP_S3_ENDPOINT: http://minio:9000
#      APP_S3_ACCESS_KEY: minioadmin
#      APP_S3_SECRET_KEY: minioadmin
    # volumes:
    #   - ~/.m2:/root/.m2 # Для кеширования зависимостей Maven (Gradle использует другой кеш)

  db:
    image: postgres
    container_name: file_exchange_db
    environment:
      POSTGRES_DB: file_exchange_db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    ports:
      - "5432:5432"
volumes:
  minio_data: