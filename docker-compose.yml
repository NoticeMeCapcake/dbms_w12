version: '3.8'

services:
  minio:
    image: minio/minio # Используйте актуальную версию
    container_name: minio_file_exchange
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server start
    volumes:
      - minio_data:/data

#  app:
#    build: . # Предполагает, что Dockerfile находится в корне проекта
#    container_name: file_exchange_app
#    ports:
#      - "8080:8080"
