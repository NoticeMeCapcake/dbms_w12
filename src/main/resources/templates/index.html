<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Secure File Exchange</title>
    <!-- Bootstrap для простого стиля -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Secure File Exchange Service</h1>

    <div class="alert alert-info" role="alert">
        <p>Пример API Key: <code th:text="${apiKey} ?: 'user-12345'">user-12345</code></p>
        <p>Файлы сохраняются в S3 с префиксом <code>files/&lt;api_key&gt;/</code></p>
    </div>

    <div th:if="${message}" class="alert alert-success" role="alert">
        <span th:text="${message}">Success Message</span>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}">Error Message</span>
    </div>
    <div th:if="${shareUrl}" class="alert alert-info" role="alert">
        <strong>Share Link:</strong> <a th:href="${shareUrl}" target="_blank" th:text="${shareUrl}">Generated URL</a>
    </div>

    <form th:action="@{/upload}" method="post" enctype="multipart/form-data" class="mb-4">
        <div class="row g-3">
            <div class="col-md-4">
                <input type="text" class="form-control" name="apiKey" th:value="${apiKey} ?: 'user-12345'" placeholder="Your API Key" required>
            </div>
            <div class="col-md-5">
                <input type="file" class="form-control" name="file" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary">Upload File</button>
            </div>
        </div>
    </form>

    <form th:action="@{/list}" method="post" class="mb-4">
        <div class="row g-3">
            <div class="col-md-9">
                <input type="text" class="form-control" name="apiKey" th:value="${apiKey} ?: 'user-12345'" placeholder="Your API Key" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-secondary">List My Files</button>
            </div>
        </div>
    </form>

    <form th:action="@{/stats}" method="post" class="mb-4">
        <div class="row g-3">
            <div class="col-md-9">
                <input type="text" class="form-control" name="apiKey" th:value="${apiKey} ?: 'user-12345'" placeholder="Your API Key" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-info">Get My Stats</button>
            </div>
        </div>
    </form>

    <div th:if="${stats}" class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Statistics</h5>
            <p class="card-text">Total Files: <span th:text="${stats.totalFiles}">0</span></p>
            <p class="card-text">Total Size (bytes): <span th:text="${stats.totalSizeBytes}">0</span></p>
        </div>
    </div>

    <div th:if="${files}" class="card">
        <div class="card-body">
            <h5 class="card-title">Your Files</h5>
            <ul class="list-group list-group-flush">
                <li th:each="file : ${files}" class="list-group-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong th:text="${file.originalFilename}">Filename</strong> - Size: <span th:text="${file.sizeBytes}">Size</span> bytes
                        </div>
                        <div class="btn-group" role="group">
                            <form th:action="@{/share}" method="post" style="display: inline;">
                                <input type="hidden" name="fileId" th:value="${#strings.substringAfterLast(file.s3Key, '/')}" />
                                <input type="hidden" name="apiKey" th:value="${apiKey} ?: 'user-12345'" />
                                <button type="submit" class="btn btn-sm btn-outline-primary">Share</button>
                            </form>
                            <form th:action="@{/delete}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this file?');">
                                <input type="hidden" name="fileId" th:value="${#strings.substringAfterLast(file.s3Key, '/')}" />
                                <input type="hidden" name="apiKey" th:value="${apiKey} ?: 'user-12345'" />
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
