server:
  port: 8080

spring:
  application:
    name: file-exchange-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true # Для отладки SQL
  thymeleaf:
    cache: false # Для разработки
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  s3:
    bucket-name: file-exchange-service
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    region: us-east-1 # MinIO игнорирует, но требуется

logging:
  level:
    software.amazon.awssdk: DEBUG
    com.example.fileexchange: DEBUG